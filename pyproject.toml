[project]
name = "fourseasquant"
version = "0.1.0"
description = "本地 A 股市场与策略复盘应用"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["backend", "scripts", "tests"]
